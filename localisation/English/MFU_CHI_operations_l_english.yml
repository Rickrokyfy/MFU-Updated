l_english:
 MFU_CHI_USA_preferences:0 "Chinese operational preferences"
 MFU_CHI_USA_preferences_desc:0 "Advisory requests for AI China. Readiness and the Chinese AI decide whether an opportunity is taken. Requests grant no equipment or combat bonuses."
 MFU_CHI_request_north:0 "Suggest East Hebei as the next objective"
 MFU_CHI_request_north_desc:0 "One preference for 30 days; a 60-day cooldown follows. Unavailable during an existing offensive window. Requires a hostile East Hebei, neighboring Chinese control and at least six Chinese divisions in Chinese-controlled Beijing. Pending requests wait for recovery and two ready weekly assessments. No attack is compelled."
 MFU_CHI_request_coast:0 "Suggest a response in Shandong"
 MFU_CHI_request_coast_desc:0 "One preference for 30 days; a 60-day cooldown follows. Unavailable during an existing offensive window. Requires hostile Shandong, neighboring Chinese control and at least six Chinese divisions in Chinese-controlled Hebei. Modestly raises that front's unit request; retaking it still waits for readiness. No units are created."
 MFU_CHI_request_recover:0 "Suggest a recovery pause"
 MFU_CHI_request_recover_desc:0 "Requests a 30-day pause from new offensives, with a 60-day cooldown. Ends the current window and starts at least 14 days of recovery. Existing defenses remain managed by China."
 MFU_CHI_cancel_request:0 "Cancel the current preference"
 MFU_CHI_cancel_request_desc:0 "Removes the advisory preference. The cooldown remains. An autonomous offensive already chosen by China is not cancelled; cancelling a recovery request does not erase its minimum recovery interval."
 MFU_CHI_status_pending:0 "Preference pending Chinese readiness"
 MFU_CHI_status_pending_desc:0 "The request is registered, but China is recovering, preparing or lacks a valid opportunity. It cannot bypass readiness. It expires after 30 days or when its target becomes invalid."
 MFU_CHI_status_active:0 "Preference: Chinese offensive window eligible"
 MFU_CHI_status_active_desc:0 "China has passed its readiness checks. A careful 14-day opportunity window is open; the engine can still decline to attack."
 MFU_CHI_status_recovery:0 "China: recovery"
 MFU_CHI_status_recovery_desc:0 "Battleplan execution and manual offensive pokes are suppressed. Minimum recovery remaining: [?CHI.MFU_CHI_recovery_days|0] days. Defense remains active."
 MFU_CHI_status_preparation:0 "China: preparation"
 MFU_CHI_status_preparation_desc:0 "Essential deployed equipment fill reached 90 percent at a weekly assessment. Two consecutive ready assessments are required after recovery. Organization, supply and local odds remain engine judgments."
 MFU_CHI_status_offensive:0 "China: careful offensive opportunity"
 MFU_CHI_status_offensive_desc:0 "The AI may select careful execution and manual attacks. Window remaining: [?CHI.MFU_CHI_window_days|0] days. A weekly equipment-fill drop below 80 percent ends the window."
 MFU_CHI_status_requested_recovery:0 "Recovery preference registered"
 MFU_CHI_status_requested_recovery_desc:0 "New offensive windows remain paused until the request expires or is cancelled. Request remaining: [?CHI.MFU_CHI_request_days|0] days."
